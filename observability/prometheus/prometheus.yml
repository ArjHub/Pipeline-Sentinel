global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: sentinel-lander
    static_configs:
      - targets: ["sentinel-lander:9108"]

  - job_name: sentinel-detector
    static_configs:
      - targets: ["sentinel-detector:9109"]

  - job_name: sentinel-api
    static_configs:
      - targets: ["sentinel-api:8000"]
