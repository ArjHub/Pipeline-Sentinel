[project]
name = "pipeline-sentinel"
version = "0.1.0"
description = "Self-diagnosing data pipeline platform"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Runtime deps are pinned in requirements/*.lock.txt (hashed); this file only holds tool config.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "spark: needs a local SparkSession (Java + pyspark)",
    "integration: needs the docker compose stack running",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/sentinel", "pipelines"]
omit = ["pipelines/dags/*"]
